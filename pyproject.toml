[project]
name = "arknightsavatar"
version = "0.1.0"
description = "Arknights NPC avatar extraction pipeline: fetch AB resources, unpack to PNG, extract avatars."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.16.3",
]

[project.optional-dependencies]
fetch = ["adb-shell>=0.4.4", "PyYAML>=6.0"]
unpack = ["UnityPy>=1.10.14", "Pillow>=10.0"]
match = ["numpy>=1.26", "opencv-python-headless>=4.8"]
# detect：CPU 推理栈（非 macOS 用 pytorch-cpu 索引的 +cpu 轮子，macOS 走默认索引）。
# 同名的 dependency-groups.detect 被 [tool.uv] default-groups 默认安装，
# 因此 `uv sync` 默认即为 CPU；detect extra 供显式 `--extra detect` 使用。
# imgutils 在模块导入期即 require onnxruntime（imgutils.utils.onnxruntime），
# 因此必须在 detect 栈中显式声明，否则 detect-bases 的头部检测无法导入。
detect = ["anime-face-detector>=0.1.0", "dghs-imgutils>=0.19.0", "onnxruntime>=1.18", "opencv-python-headless>=4.8", "numpy>=1.26", "tqdm>=4.66", "torch==2.13.0+cpu; sys_platform != 'darwin'", "torch==2.13.0; sys_platform == 'darwin'", "torchvision==0.28.0+cpu; sys_platform != 'darwin'", "torchvision==0.28.0; sys_platform == 'darwin'"]
# detect-gpu：pytorch-cu126 索引的 CUDA 轮子（Windows / Linux x86_64）。
# 与 detect 二选一（conflicting extras，见 [tool.uv.conflicts]），
# 安装命令：uv sync --no-group detect --extra detect-gpu
detect-gpu = ["anime-face-detector>=0.1.0", "dghs-imgutils>=0.19.0", "onnxruntime>=1.18", "opencv-python-headless>=4.8", "numpy>=1.26", "tqdm>=4.66", "torch==2.13.0+cu126; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')", "torchvision==0.28.0+cu126; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')"]

[project.scripts]
# 统一入口（子命令分发）
arknightsavatar = "arknightsavatar.cli:main"
# 编排型入口
arknightsavatar-run = "arknightsavatar.run:main"
arknightsavatar-pull = "arknightsavatar.pull:main"
arknightsavatar-produce = "arknightsavatar.produce:main"
arknightsavatar-build-model = "arknightsavatar.build_model:main"
arknightsavatar-derive-model = "arknightsavatar.derive_model:main"
arknightsavatar-sync-cache = "arknightsavatar.sync_cache:main"
# 交互初始化（全量同步 / 选择分类下载）
arknightsavatar-setup = "arknightsavatar.setup:main"
# 单工具
arknightsavatar-fetch = "arknightsavatar.fetch:main"
arknightsavatar-unpack = "arknightsavatar.unpack.unpacker:main"
arknightsavatar-classify = "arknightsavatar.classify:main"
arknightsavatar-sample-bases = "arknightsavatar.sample_bases:main"
arknightsavatar-match = "arknightsavatar.match:main"
arknightsavatar-detect = "arknightsavatar.detect:main"
arknightsavatar-detect-bases = "arknightsavatar.detect_bases:main"
arknightsavatar-extract = "arknightsavatar.extract:main"
arknightsavatar-collage = "arknightsavatar.collage:main"
arknightsavatar-export-webp = "arknightsavatar.export_webp:main"
arknightsavatar-npc-json = "arknightsavatar.npc_json:main"
arknightsavatar-pull-apk = "arknightsavatar.pull_apk:main"
arknightsavatar-device-caps = "arknightsavatar.device_caps:main"
# 增量更新数据文件（manifest / version.json / changes / changelog / characters.csv）
arknightsavatar-manifest = "arknightsavatar.manifest_tool:main"

[dependency-groups]
dev = ["pytest>=8.0", "numpy>=1.26", "opencv-python-headless>=4.8", "Pillow>=10.0", "lz4>=4.0", "unitypy>=1.10.14", "adb-shell>=0.4.4"]
# 与 extra detect 同内容的 CPU 推理栈；默认安装（见 [tool.uv] default-groups），
# 使 `uv sync` 默认即为 CPU。
detect = ["anime-face-detector>=0.1.0", "dghs-imgutils>=0.19.0", "onnxruntime>=1.18", "opencv-python-headless>=4.8", "numpy>=1.26", "tqdm>=4.66", "torch==2.13.0+cpu; sys_platform != 'darwin'", "torch==2.13.0; sys_platform == 'darwin'", "torchvision==0.28.0+cpu; sys_platform != 'darwin'", "torchvision==0.28.0; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arknightsavatar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# detect（CPU）与 detect-gpu（CUDA）互斥：conflicting extras/groups 让 uv
# 在不同 fork 中分别解析；同时安装两者会得到清晰的报错。
conflicts = [
  [{ extra = "detect" }, { extra = "detect-gpu" }],
  [{ group = "detect" }, { extra = "detect-gpu" }],
]
# `uv sync` 默认安装 dev + detect（CPU 推理栈）。
default-groups = ["dev", "detect"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# detect → pytorch-cpu 索引（+cpu 轮子）；detect-gpu → pytorch-cu126 索引
# （仅 Windows / Linux x86_64，cu126 无其它平台轮子）。macOS 与 Linux aarch64
# 不命中任何指派，回落默认索引（PyPI CPU 轮子）。
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "detect", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", group = "detect", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "detect-gpu", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "detect", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", group = "detect", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "detect-gpu", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

# 固化 ruff 默认规则集（之前隐式依赖 ruff 默认行为，跨版本易漂移）。
# 仅 pin 当前默认行的最小等价集，使 `ruff check` 的绿构建可复现；更宽的
# 规则集（PL.W/S/BLE 等）会引入大量告警，作为独立后续项分批治理。
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
