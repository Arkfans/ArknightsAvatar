[project]
name = "npcavatar"
version = "0.1.0"
description = "Arknights NPC avatar extraction pipeline: fetch AB resources, unpack to PNG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fetch = ["adb-shell>=0.4.4", "PyYAML>=6.0"]
unpack = ["UnityPy>=1.10.14", "Pillow>=10.0"]
match = ["numpy>=1.26", "opencv-python-headless>=4.8"]
detect = ["anime-face-detector>=0.1.0", "dghs-imgutils>=0.19.0", "onnxruntime>=1.18", "torch>=2.2", "torchvision>=0.17", "opencv-python-headless>=4.8", "numpy>=1.26", "tqdm>=4.66"]

[project.scripts]
npcavatar-fetch = "npcavatar.fetch:main"
npcavatar-unpack = "npcavatar.unpack.unpacker:main"
npcavatar-classify = "npcavatar.classify:main"
npcavatar-sample-bases = "npcavatar.sample_bases:main"
npcavatar-match = "npcavatar.match:main"
npcavatar-detect = "npcavatar.detect:main"
npcavatar-detect-bases = "npcavatar.detect_bases:main"
npcavatar-extract = "npcavatar.extract:main"
npcavatar-collage = "npcavatar.collage:main"
npcavatar-export-webp = "npcavatar.export_webp:main"
npcavatar-npc-json = "npcavatar.npc_json:main"

[dependency-groups]
dev = ["pytest>=8.0", "numpy>=1.26", "opencv-python-headless>=4.8", "Pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npcavatar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

